version: '3.8'

services:
  # ============================================
  # PostgreSQL - Base de datos principal
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: sweet-grace-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sweet_grace_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sweet-grace

  # ============================================
  # Redis - Caché y sesiones
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: sweet-grace-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sweet-grace

  # ============================================
  # PgAdmin - UI para PostgreSQL (opcional)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sweet-grace-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sweetgrace.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    networks:
      - sweet-grace

volumes:
  postgres_data:
  redis_data:

networks:
  sweet-grace:
    driver: bridge
